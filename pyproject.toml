[project]
name = "guardrailed-agent"
version = "0.0.0"
description = "ms3dm.tech Guardrailed Agent — Bedrock-native reference architecture"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "mcp>=1.0,<2.0",
    "pyyaml>=6.0",
]

# ADR-006 Phase 2 — pipeable CLI surface (`gra ask` / `personas` / `traces`).
[project.scripts]
gra = "gra.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gagent_client", "mcp_server", "gra"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["lambdas", "data", "eval"]
pythonpath = ["."]

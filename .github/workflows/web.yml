name: web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "terraform/modules/web-demo/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web
        env:
          VITE_API_ENDPOINT: ${{ vars.VITE_API_ENDPOINT }}
          VITE_USER_POOL_ID: ${{ vars.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ vars.VITE_USER_POOL_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_REDIRECT_SIGN_IN: ${{ vars.VITE_REDIRECT_SIGN_IN }}
          VITE_REDIRECT_SIGN_OUT: ${{ vars.VITE_REDIRECT_SIGN_OUT }}
          VITE_AWS_REGION: ${{ vars.VITE_AWS_REGION }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: demo
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Resolve bucket + distribution from SSM
        id: ssm
        run: |
          set -euo pipefail
          BUCKET=$(aws ssm get-parameter \
            --name /gagent/demo/web_bucket_name \
            --query Parameter.Value --output text)
          DIST=$(aws ssm get-parameter \
            --name /gagent/demo/web_distribution_id \
            --query Parameter.Value --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "distribution=${DIST}" >> "$GITHUB_OUTPUT"
      - name: Sync to S3
        run: |
          aws s3 sync web/dist/ "s3://${{ steps.ssm.outputs.bucket }}/" --delete
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.ssm.outputs.distribution }}" \
            --paths "/*"
